[workspace]
resolver = "3"
members = ["core/mcpwall"]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
globset = "0.4"
memchr = "2"
nix = { version = "0.31", default-features = false, features = ["signal"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
sha2 = "0.10"
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "macros", "io-util", "io-std", "process", "sync", "signal", "time", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
