[workspace]
resolver = "3"
members = ["core/mcpwall"]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
memchr = "2"
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["rt", "macros", "io-util", "io-std", "process", "sync"] }
