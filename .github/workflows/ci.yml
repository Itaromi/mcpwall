name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  core:
    name: core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Le produit est macOS, mais le core doit rester portable Linux.
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      # La toolchain vient de rust-toolchain.toml, épinglée exprès.
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
