name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  core:
    name: core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The product is macOS, but the core must stay portable to Linux.
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      # The toolchain comes from rust-toolchain.toml, pinned deliberately.
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # The benchmark only asserts in release: a debug binary measures the cost
      # of overflow checks, not the cost of the product.
      - run: cargo test --release --test bench -- --nocapture

  app:
    name: app macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2

      # macOS runners have Xcode: unlike a machine with only the Command Line
      # Tools, the universal build works there.
      - run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build the app
        working-directory: app
        run: swift build -c release

      - name: Assemble the bundle
        run: ./scripts/build-app.sh

      # Checks what cannot be checked on a machine without Xcode: that both of
      # the bundle's binaries really are universal. An arm64-only .dmg would not
      # start on an Intel machine, and we would only find out after publishing.
      - name: Check the architectures
        run: |
          set -euo pipefail
          for binary in \
              build/mcpwall.app/Contents/MacOS/mcpwall \
              build/mcpwall.app/Contents/Resources/mcpwall; do
              archs="$(lipo -archs "$binary")"
              echo "$binary: $archs"
              case "$archs" in
                  *arm64*) ;;
                  *) echo "::error::$binary is not compiled for arm64"; exit 1 ;;
              esac
              case "$archs" in
                  *x86_64*) ;;
                  *) echo "::error::$binary is not compiled for x86_64"; exit 1 ;;
              esac
          done

      - uses: actions/upload-artifact@v4
        with:
          name: mcpwall-app-unsigned
          path: build/mcpwall.app
          # Unsigned and un-notarised: usable for testing, not for
          # distribution. See scripts/sign-app.sh.
          if-no-files-found: error
